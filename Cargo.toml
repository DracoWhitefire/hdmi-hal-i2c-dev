[package]
name = "hdmi-hal-i2c-dev"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Linux userspace hdmi-hal backend via /dev/i2c-N (i2c-dev)"
readme = "README.md"
license = "MPL-2.0"
repository = "https://github.com/DracoWhitefire/hdmi-hal-i2c-dev"
keywords = ["hdmi", "i2c", "linux", "hal", "scdc"]
categories = ["hardware-support", "embedded"]

[package.metadata.docs.rs]
all-features = true

[features]
integration = []

[dependencies]
display-types = "0.3.1"
hdmi-hal = { path = "../hdmi-hal" }
i2cdev = "0.6.2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
