[package]
name = "hdmi-hal-i2c-dev"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Linux userspace hdmi-hal backend via /dev/i2c-N (i2c-dev)"
readme = "README.md"
license = "MPL-2.0"
repository = "https://github.com/DracoWhitefire/hdmi-hal-i2c-dev"
homepage = "https://ashlar-display.org"
keywords = ["ashlar", "hdmi", "i2c", "linux", "scdc"]
categories = ["hardware-support", "embedded", "os::linux-apis"]

[package.metadata.docs.rs]
all-features = true

[features]
integration = []

[dependencies]
display-types = "0.4"
hdmi-hal = "0.5"
i2cdev = "0.6.2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
